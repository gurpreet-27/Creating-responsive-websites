<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group of Animals</title>
    <style>
        .grid-container div{
            border: 1px solid red;
        }
        .grid-container {
            display:grid;
            grid-gap: 20px 30px;
        }
        .grid-item-1 {
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end: 2;
        }
        .grid-item-2{
            grid-column: 2/3;
            grid-row: 1/2;
        }
        .grid-item-3{
            grid-column: 1 / span 2;
            grid-row: 3 / span 1;
        }
        .grid-item-4 {
             grid-area: 4 / 2 / 5 / 3;
        }
        .grid-container {
            grid-template-columns: 20px 30px 30px 40px;
            grid-template-rows: auto auto auto auto;
        } 
    </style>
</head>
<body>
    <h1>Groups of Animals</h1>
    <div class="grid-container">
        <div class="grid-item-1">
            <p>A murder of crows</p>
        </div>
    
    <div class="grid-item-2">
        <p>A gaggle of geege</p>
    </div>

    <div class="grid-item-3">
        <p>A school of fish</p>
    </div>
    <div class="grid-item-4">
        <p>A pride of lions</p>
    </div>
    </div>
</body>
</html>
